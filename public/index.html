<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reimbursement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f4ee;
    --paper-edge: #eae6d9;
    --ink: #211f1a;
    --ink-soft: #6b6558;
    --line: #cdc6b3;
    --accent: #3b4fb5;
    --accent-ink: #2c3b8c;
    --radius: 2px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #e9e6dc 0%, #dedad0 100%);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 16px 64px;
  }

  .board {
    width: 100%;
    max-width: 460px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  .masthead {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.14em;
    font-size: 16px;
    text-transform: uppercase;
  }

  .subhead {
    margin-top: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    display: block;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 18px 40px -24px rgba(30, 28, 22, 0.5), 0 2px 0 var(--paper-edge);
    padding: 22px 22px 24px;
    text-decoration: none;
    color: var(--ink);
    position: relative;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 44px -22px rgba(30, 28, 22, 0.55), 0 2px 0 var(--paper-edge);
  }
  .card:hover .card-title { color: var(--accent-ink); }

  .card-icon {
    width: 34px;
    height: 34px;
    margin-bottom: 12px;
    color: var(--accent-ink);
  }
  .card-icon svg { width: 100%; height: 100%; }

  .card-title {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    letter-spacing: 0.06em;
    font-size: 14px;
    text-transform: uppercase;
  }

  .card-desc {
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  .card-arrow {
    position: absolute;
    top: 22px;
    right: 20px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 16px;
  }
  .card:hover .card-arrow { color: var(--accent-ink); }
</style>
</head>
<body>

<div class="board">
  <header>
    <div class="masthead">Reimbursement</div>
    <div class="subhead">Pick a tool</div>
  </header>

  <div class="cards">
    <a class="card" href="/bill.html">
      <span class="card-arrow">&rarr;</span>
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
      </div>
      <div class="card-title">Bill Submission</div>
      <div class="card-desc">Submit a food bill — date, amount, merchant, and a photo/PDF proof — straight to Google Drive with a running CSV log.</div>
    </a>

    <a class="card" href="/ocr.html">
      <span class="card-arrow">&rarr;</span>
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="11" r="2.3"/><path d="M3 16l4.5-4 3 2.5L16 10l5 6"/></svg>
      </div>
      <div class="card-title">OCR Image Upload</div>
      <div class="card-desc">Upload or photograph a receipt image and save it straight to Google Drive.</div>
    </a>
  </div>
</div>

</body>
</html>
